name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ======================================================================
  # Job 2 -- Backend Test & Build (Pytest + Docker image + smoke tests)
  # ======================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend
      IMAGE_NAME: blockscore-backend
      IMAGE_TAG: ci-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          file: ${{ env.BACKEND_DIR }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke test backend container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name backend-smoke -p 5000:5000 \
            -e FLASK_ENV=production \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e JWT_SECRET_KEY="$(openssl rand -hex 32)" \
            "${IMAGE_NAME}:${IMAGE_TAG}"
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health; then
              echo
              echo "Backend healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy"
          docker logs backend-smoke
          exit 1

      - name: Verify production rejects weak secrets
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm \
            -e FLASK_ENV=production \
            -e SECRET_KEY=change-me-in-production \
            -e JWT_SECRET_KEY=change-me-jwt-in-production \
            "${IMAGE_NAME}:${IMAGE_TAG}" python -c "import app" 2> weak-secrets.log; then
            echo "Backend started with placeholder secrets"
            exit 1
          fi
          grep -q "Refusing to start in production" weak-secrets.log

      - name: Show container logs on failure
        if: failure()
        run: docker logs backend-smoke || true

      - name: Stop smoke test container
        if: always()
        run: docker rm -f backend-smoke || true

      - name: Export backend image
        if: success()
        run: docker save "${IMAGE_NAME}:${IMAGE_TAG}" | gzip > backend-image.tar.gz

      - name: Upload backend image artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image
          path: backend-image.tar.gz
          retention-days: 7

  # ============================================================
  # Job 3 -- AI Models Test & Validation (Pytest + coverage)
  # ============================================================
  ai_models_test:
    name: AI Models Test & Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      AI_MODELS_DIR: code/ai_models
      # The service is imported as the top-level package "src" (and wsgi), so the
      # ai_models directory itself must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code/ai_models

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/ai_models/requirements.txt

      # shap (requirements-research.txt) is optional: the research ensemble
      # guards its import, so it is not installed here.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "${AI_MODELS_DIR}/requirements.txt"
          python -m pip install pytest pytest-cov

      - name: Byte-compile all ai_models sources
        run: |
          set -euo pipefail
          echo "=== Compiling api, scoring, training, research, wsgi and tests ==="
          python -m compileall -q "${AI_MODELS_DIR}"

      - name: Verify sub-packages import cleanly
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib

          import src

          for module in (
              "src.config",
              "src.api",
              "src.api.app",
              "src.api.routes",
              "src.api.security",
              "src.scoring",
              "src.scoring.service",
              "src.scoring.registry",
              "src.scoring.features",
              "src.scoring.rules",
              "src.training",
              "src.research.credit_ensemble",
              "src.research.risk_analytics",
              "wsgi",
          ):
              importlib.import_module(module)
              print(f"OK   {module}")
          print(f"blockscore-ai {src.__version__} imports cleanly")
          PY

      - name: Run ai_models test suite
        working-directory: ${{ env.AI_MODELS_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      - name: Upload ai_models coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-coverage-report
          path: code/ai_models/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # Job 4 -- Smart Contract Compile & Test (Hardhat)
  # ============================================================
  blockchain_tests:
    name: Smart Contract Compile & Test
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile smart contracts
        run: npm run compile

      - name: Run smart contract test suite
        run: npm test

      - name: Upload compiled contract artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-artifacts
          path: code/blockchain/artifacts/
          retention-days: 7

  # ============================================================
  # Job 5 -- Web Frontend Test & Build
  # ============================================================
  web-frontend_test_and_build:
    name: Web-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 6 -- Mobile Frontend (Expo) Test & Build
  # ============================================================
  mobile_frontend:
    name: Mobile-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: mobile-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Tests
        run: npm run test:ci

      - name: Build Mobile Web Export
        run: CI=false npm run build:web

      - name: Upload Mobile Web Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: mobile-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 7 -- Docs Validation
  # ============================================================
  docs_validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Markdown (docs/ and root README)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/markdownlint.jsonc" <<'EOF'
          {
            "config": {
              "default": true,
              "MD013": false,
              "MD033": {
                "allowed_elements": ["img", "div", "p", "br", "a", "picture", "source", "details", "summary"]
              }
            }
          }
          EOF
          npx --yes markdownlint-cli2@0.24.0 --config "$RUNNER_TEMP/markdownlint.jsonc" "docs/**/*.md" README.md

      - name: Install lychee (link checker)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin" --strip-components=1 --wildcards '*/lychee'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check internal links and anchors
        run: |
          lychee --offline --no-progress --include-fragments \
            'docs/**/*.md' README.md scripts/README.md infrastructure/README.md .github/readme/README.md

      - name: Validate code samples (python, bash, json)
        run: |
          python - <<'PY'
          import ast, json, pathlib, re, subprocess, sys

          FENCE = re.compile(r"^```([A-Za-z0-9_+-]*)[^\n]*\n(.*?)^```", re.S | re.M)
          failures = checked = 0
          files = sorted(pathlib.Path("docs").rglob("*.md")) + [pathlib.Path("README.md")]
          for path in files:
              text = path.read_text(encoding="utf-8")
              for m in FENCE.finditer(text):
                  lang, body = m.group(1).lower(), m.group(2)
                  line = text.count("\n", 0, m.start()) + 1
                  err = None
                  if lang in ("python", "py"):
                      try:
                          ast.parse(body)
                      except SyntaxError as e:
                          err = f"python: {e.msg} (block line {e.lineno})"
                  elif lang in ("bash", "sh", "shell"):
                      r = subprocess.run(["bash", "-n"], input=body, text=True, capture_output=True)
                      if r.returncode:
                          err = "bash: " + r.stderr.strip().splitlines()[-1]
                  elif lang == "json":
                      try:
                          json.loads(body)
                      except ValueError as e:
                          err = f"json: {e}"
                  else:
                      continue
                  checked += 1
                  if err:
                      failures += 1
                      print(f"::error file={path},line={line}::{err}")
          print(f"Checked {checked} code blocks, {failures} invalid")
          sys.exit(1 if failures else 0)
          PY

      - name: Check docs are consistent with the repository
        run: |
          set -euo pipefail
          status=0

          # Every script in scripts/ must be documented in docs/CLI.md, and vice versa.
          scripts=$(for f in scripts/*.sh; do basename "$f"; done | sort)
          # shellcheck disable=SC2016  # the backticks are literal Markdown code spans
          documented=$(grep -oE '`[A-Za-z0-9_-]+\.sh`' docs/CLI.md | tr -d '`' | sort -u)
          for s in $(comm -23 <(echo "$scripts") <(echo "$documented")); do
            echo "::error file=docs/CLI.md::scripts/$s exists but is not documented in docs/CLI.md"; status=1
          done
          for s in $(comm -13 <(echo "$scripts") <(echo "$documented")); do
            echo "::error file=docs/CLI.md::docs/CLI.md documents $s but scripts/$s does not exist"; status=1
          done

          # Every page in docs/ must be reachable from the docs index.
          for f in docs/*.md docs/examples/*.md; do
            name=${f#docs/}
            [ "$name" = "README.md" ] && continue
            grep -q "($name)" docs/README.md || { echo "::error file=$f::not linked from docs/README.md"; status=1; }
          done

          # Large binaries bloat clones; warn only.
          while IFS= read -r big; do
            echo "::warning file=$big::file is larger than 5 MB; consider compressing it (e.g. PNG/WebP instead of BMP)"
          done < <(find docs -type f -size +5M)

          exit "$status"

      - name: Check external links (advisory)
        continue-on-error: true
        run: |
          lychee --no-progress --max-retries 2 --timeout 20 --accept '200..=299,429' \
            'docs/**/*.md' README.md

  # ============================================================
  # Job 8 -- Infrastructure Validation
  # (Terraform, Kubernetes, Ansible, Docker)
  # ============================================================
  infrastructure_validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 30

    env:
      KUBERNETES_VERSION: "1.28.0"
      KUBECONFORM_VERSION: "0.7.0"
      HADOLINT_VERSION: "2.15.1"
      ANSIBLE_CONFIG: ${{ github.workspace }}/infrastructure/ansible/ansible.cfg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/requirements-ci.txt

      - name: Install CI tooling (pinned in infrastructure/requirements-ci.txt)
        run: python -m pip install -r infrastructure/requirements-ci.txt

      # ---- Terraform ----------------------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false

      - name: Terraform format check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        working-directory: infrastructure/terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Check every root variable is used and every tfvars key is declared
        working-directory: infrastructure/terraform
        run: |
          set -euo pipefail
          status=0
          while read -r v; do
            if ! cat main.tf outputs.tf | grep -qE "var\\.${v}\\b"; then
              echo "::error file=infrastructure/terraform/variables.tf::variable ${v} is declared but never used"
              status=1
            fi
          done < <(grep -ohE '^variable "[a-z0-9_]+"' variables.tf | cut -d'"' -f2)
          for f in environments/*/terraform.tfvars terraform.tfvars.example; do
            while read -r k; do
              if ! grep -qE "^variable \"${k}\"" variables.tf; then
                echo "::error file=infrastructure/terraform/${f}::${k} is set but not declared in variables.tf"
                status=1
              fi
            done < <(grep -oE '^[a-z0-9_]+[[:space:]]*=' "$f" | tr -d ' =')
          done
          exit "$status"

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0

      - name: TFLint (fails on errors, prints warnings)
        working-directory: infrastructure/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tflint --init
          tflint --recursive --minimum-failure-severity=error

      # ---- Kubernetes ---------------------------------------
      # The manifests in kubernetes/base are Go templates filled from
      # kubernetes/environments/<env>/values.yaml, so they are rendered offline
      # first and the result is checked against the Kubernetes schemas.
      - name: Install kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render and validate Kubernetes manifests (dev, staging, prod)
        working-directory: infrastructure
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, re, sys
          import yaml

          base = pathlib.Path("kubernetes/base")
          out_dir = pathlib.Path(os.environ["RUNNER_TEMP"])
          EXPR = re.compile(r"\{\{\s*(.*?)\s*\}\}")
          problems = []


          def lookup(values, dotted):
              node = values
              for part in dotted.split("."):
                  if not isinstance(node, dict) or part not in node:
                      raise KeyError(dotted)
                  node = node[part]
              return node


          def render(text, values, source):
              def sub(match):
                  expr = match.group(1)
                  try:
                      m = re.fullmatch(r"\.Values\.([A-Za-z0-9_.]+)(\s*\|\s*toString)?", expr)
                      if m:
                          return str(lookup(values, m.group(1)))
                      m = re.fullmatch(r"mul\s+\.Values\.([A-Za-z0-9_.]+)\s+(\d+)", expr)
                      if m:
                          return str(int(lookup(values, m.group(1))) * int(m.group(2)))
                  except KeyError as exc:
                      problems.append(f"{source}: value {exc} is not defined in the environment values file")
                      return "UNDEFINED"
                  problems.append(f"{source}: unsupported template expression '{{{{ {expr} }}}}'")
                  return "UNSUPPORTED"

              return EXPR.sub(sub, text)


          templates = sorted(p for p in base.glob("*.yaml") if not p.name.endswith(".example.yaml"))
          all_values = {}
          for env in ("dev", "staging", "prod"):
              values = yaml.safe_load(pathlib.Path(f"kubernetes/environments/{env}/values.yaml").read_text())
              all_values[env] = values
              rendered = []
              for tpl in templates:
                  text = tpl.read_text()
                  if re.search(r"\{\s+\{|\}\s+\}", text):
                      problems.append(f"{tpl}: malformed template delimiters ('{{ {{' or '}} }}'); Helm would not render them")
                  rendered.append(render(text, values, f"{env}/{tpl.name}"))
              (out_dir / f"k8s-{env}.yaml").write_text("\n---\n".join(rendered))

              try:
                  docs = [d for d in yaml.safe_load_all((out_dir / f"k8s-{env}.yaml").read_text()) if d]
              except yaml.YAMLError as exc:
                  problems.append(f"{env}: rendered manifests are not valid YAML: {str(exc).splitlines()[0]}")
                  continue
              prefix = values["appName"]
              services = {d["metadata"]["name"] for d in docs if d["kind"] == "Service"}
              secrets = {d["metadata"]["name"] for d in docs if d["kind"] == "Secret"}
              configmaps = {d["metadata"]["name"] for d in docs if d["kind"] == "ConfigMap"}

              # Service hostnames in the ConfigMap must match Services that exist
              config = next(d for d in docs if d["kind"] == "ConfigMap" and d["metadata"]["name"] == f"{prefix}-config")["data"]
              for key in ("REDIS_HOST", "DATABASE_HOST"):
                  if config[key] not in services:
                      problems.append(f"{env}: ConfigMap {key}={config[key]} does not match any Service {sorted(services)}")
              api_host = re.sub(r"^[a-z]+://", "", config["API_URL"]).split(":")[0].split("/")[0]
              if api_host not in services:
                  problems.append(f"{env}: ConfigMap API_URL host {api_host} does not match any Service {sorted(services)}")

              # Every Secret / ConfigMap referenced by a workload must be defined
              for d in docs:
                  if d["kind"] not in ("Deployment", "StatefulSet"):
                      continue
                  pod = d["spec"]["template"]["spec"]
                  for c in pod.get("containers", []):
                      for env_var in c.get("env", []):
                          ref = env_var.get("valueFrom", {}).get("secretKeyRef")
                          if ref and ref["name"] not in secrets:
                              problems.append(f"{env}: {d['kind']}/{d['metadata']['name']} references missing Secret {ref['name']}")
                      for source in c.get("envFrom", []):
                          ref = source.get("configMapRef")
                          if ref and ref["name"] not in configmaps:
                              problems.append(f"{env}: {d['kind']}/{d['metadata']['name']} references missing ConfigMap {ref['name']}")

              # Every Service must select pods that a workload actually creates
              labels = [d["spec"]["template"]["metadata"]["labels"] for d in docs if d["kind"] in ("Deployment", "StatefulSet")]
              for d in docs:
                  if d["kind"] == "Service":
                      selector = d["spec"].get("selector", {})
                      if not any(all(l.get(k) == v for k, v in selector.items()) for l in labels):
                          problems.append(f"{env}: Service/{d['metadata']['name']} selector {selector} matches no workload")

              # Production must not float on mutable image tags
              if env == "prod":
                  for name in ("backend", "frontend"):
                      if values[name]["image"]["tag"] == "latest":
                          problems.append(f"prod: {name} image tag must be pinned, not 'latest'")


          # The three environments must define exactly the same keys
          def keys(node, prefix=""):
              if isinstance(node, dict):
                  for k, v in node.items():
                      yield from keys(v, f"{prefix}{k}.")
              else:
                  yield prefix.rstrip(".")


          reference = set(keys(all_values["dev"]))
          for env in ("staging", "prod"):
              current = set(keys(all_values[env]))
              for missing in sorted(reference - current):
                  problems.append(f"{env}: values.yaml is missing key {missing} (present in dev)")
              for extra in sorted(current - reference):
                  problems.append(f"{env}: values.yaml has key {extra} that dev does not define")

          for p in problems:
              print(f"::error::{p}")
          print("Kubernetes templates OK" if not problems else f"{len(problems)} problem(s)")
          sys.exit(1 if problems else 0)
          PY
          for env in dev staging prod; do
            kubeconform -kubernetes-version "$KUBERNETES_VERSION" -strict -summary -ignore-missing-schemas \
              -schema-location default "$RUNNER_TEMP/k8s-$env.yaml"
          done

      # ---- Ansible ------------------------------------------
      - name: Install Ansible collections
        working-directory: infrastructure/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible syntax check
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          if [ ! -f inventory/hosts.yml ]; then
            echo "::notice::inventory/hosts.yml is not tracked; validating with the example inventory"
            cp inventory/hosts.example.yml inventory/hosts.yml
          fi
          ansible-playbook --syntax-check playbooks/main.yml

      - name: Check every play matches at least one host
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          empty=$(ansible-playbook --list-hosts playbooks/main.yml | awk '/^ *play #/{play=$0} /hosts \(0\)/{print play}')
          if [ -n "$empty" ]; then
            while IFS= read -r line; do
              echo "::error::play matches no hosts: $line"
            done <<< "$empty"
            exit 1
          fi

      - name: ansible-lint (content must load; full style rules are not enforced)
        working-directory: infrastructure/ansible
        run: ansible-lint --offline --profile min .

      - name: Check role template and include references resolve
        working-directory: infrastructure/ansible
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          def walk(tasks):
              for task in tasks or []:
                  yield task
                  for key in ("block", "rescue", "always"):
                      yield from walk(task.get(key))

          bad = 0
          for tasks_file in sorted(pathlib.Path("roles").glob("*/tasks/*.yml")):
              role = tasks_file.parents[1]
              for task in walk(yaml.safe_load(tasks_file.read_text())):
                  for mod in ("template", "ansible.builtin.template"):
                      if mod in task:
                          src = task[mod]["src"]
                          if "{{" not in src and not (role / "templates" / src).exists():
                              print(f"::error file=infrastructure/ansible/{tasks_file}::template {src} does not exist in {role}/templates")
                              bad += 1
                  for mod in ("include_tasks", "import_tasks", "ansible.builtin.include_tasks", "ansible.builtin.import_tasks"):
                      if mod in task:
                          ref = task[mod] if isinstance(task[mod], str) else task[mod].get("file")
                          if ref and "{{" not in ref and not (tasks_file.parent / ref).exists():
                              print(f"::error file=infrastructure/ansible/{tasks_file}::{mod} {ref} does not exist")
                              bad += 1
          print("All references resolve" if not bad else f"{bad} unresolved reference(s)")
          sys.exit(1 if bad else 0)
          PY

      # Rendering with Ansible's own engine catches undefined variables and template
      # syntax errors that a syntax check cannot. app_name normally comes from the inventory.
      - name: Render role templates
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rendered"
          cat > "$RUNNER_TEMP/render.yml" <<'EOF'
          - hosts: localhost
            connection: local
            gather_facts: true
            vars_files:
              - "{{ role_dir }}/vars/main.yml"
            tasks:
              - ansible.builtin.template:
                  src: "{{ item }}"
                  dest: "{{ out_dir }}/{{ item | basename | regex_replace('[.]j2$', '') }}"
                  mode: "0644"
                with_fileglob: "{{ role_dir }}/templates/*.j2"
          EOF
          for role in database webserver; do
            ansible-playbook -i localhost, "$RUNNER_TEMP/render.yml" \
              -e "role_dir=$PWD/roles/$role" -e "out_dir=$RUNNER_TEMP/rendered" \
              -e "app_name=blockscore"
          done
          test -s "$RUNNER_TEMP/rendered/my.cnf"
          test -s "$RUNNER_TEMP/rendered/nginx.conf"

      - name: yamllint (Kubernetes, Ansible, Compose)
        working-directory: infrastructure
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, truthy: disable}}" \
            kubernetes/base ansible docker-compose.yml docker-compose.dev.yml

      # ---- Docker -------------------------------------------
      - name: Validate Docker Compose files
        working-directory: infrastructure
        run: |
          set -euo pipefail
          cp docker/.env.example docker/.env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Lint Dockerfiles (fails on errors, prints warnings)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          chmod +x "$HOME/.local/bin/hadolint"
          hadolint --failure-threshold error \
            infrastructure/docker/Dockerfile.backend \
            infrastructure/docker/Dockerfile.frontend \
            infrastructure/docker/Dockerfile.proxy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The application images are built in the Backend job; build the proxy image here.
      - name: Build proxy Docker image
        uses: docker/build-push-action@v6
        with:
          context: infrastructure
          file: infrastructure/docker/Dockerfile.proxy
          push: false
          tags: blockscore/proxy:ci-${{ github.sha }}
          cache-from: type=gha,scope=proxy-image
          cache-to: type=gha,mode=max,scope=proxy-image

      # ---- Secrets ------------------------------------------
      - name: Scan infrastructure for hard-coded secrets
        working-directory: infrastructure
        run: |
          set -uo pipefail
          found=0
          for pattern in 'password\s*=\s*"[^"]{8,}"' 'secret\s*=\s*"[^"]{8,}"' 'api[_-]key\s*=\s*"[^"]{8,}"' 'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY'; do
            hits=$(grep -rEIin "$pattern" terraform kubernetes ansible \
              | grep -v '\.example' \
              | grep -viE 'placeholder|change_?me|:[0-9]+:\s*#' || true)
            if [ -n "$hits" ]; then
              echo "::error::possible hard-coded secret matching /$pattern/"
              echo "$hits"
              found=1
            fi
          done
          exit "$found"

  # ============================================================
  # Job 9 -- Scripts Validation
  # ============================================================
  scripts_validation:
    name: Scripts Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ShellCheck
        run: python -m pip install shellcheck-py==0.11.0.1

      - name: ShellCheck all tracked shell scripts (fails on warnings and errors)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

      - name: ShellCheck stricter style findings (advisory)
        continue-on-error: true
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=info

      - name: Check syntax and shebang of all tracked shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
            head -n 1 "$f" | grep -qE '^#!.*(bash|sh)' || { echo "::error file=$f::missing shebang"; exit 1; }
          done < <(git ls-files -z '*.sh')

      - name: Check shell scripts are executable in git
        run: |
          missing=$(git ls-files -s '*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$missing" ]; then
            while IFS= read -r f; do
              echo "::error file=$f::not executable in git. Fix: git update-index --chmod=+x $f"
            done <<< "$missing"
            exit 1
          fi

      # Only scripts with a real --help handler are listed: the others
      # (run_blockscore.sh, lint-all.sh, ...) would start services or run
      # linters instead of printing usage.
      - name: Smoke test --help on CLI scripts
        run: |
          set -uo pipefail
          status=0
          before=$(git status --porcelain)
          for s in code_quality_check component_restart multi_component_build smart_contract_deploy; do
            if out=$(timeout 30 bash "scripts/$s.sh" --help </dev/null 2>&1) && grep -qi 'usage' <<< "$out"; then
              echo "OK   $s.sh --help"
            else
              echo "::error file=scripts/$s.sh::--help did not exit 0 with a usage message"
              status=1
            fi
          done
          after=$(git status --porcelain)
          if [ "$before" != "$after" ]; then
            echo "::error::--help modified the working tree:"; git status --porcelain; status=1
          fi
          exit "$status"
