---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.appName }}-database"
  labels:
    app: "{{ .Values.appName }}-database"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    # prettier-ignore
    - port: {{ .Values.database.servicePort }}
      # prettier-ignore
      targetPort: {{ .Values.database.containerPort }}
      protocol: TCP
      name: mysql
  selector:
    app: "{{ .Values.appName }}-database"
