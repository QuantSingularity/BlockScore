---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.appName }}-redis"
  labels:
    app: "{{ .Values.appName }}-redis"
spec:
  type: ClusterIP
  ports:
    # prettier-ignore
    - port: {{ .Values.redis.servicePort }}
      # prettier-ignore
      targetPort: {{ .Values.redis.containerPort }}
      protocol: TCP
      name: redis
  selector:
    app: "{{ .Values.appName }}-redis"
